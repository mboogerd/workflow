workflow:
  id: continuous-repositories
  version: 1
  context:
    # This provider remains open. The durable host injects offline fixture events.
    event: {provider: demo.commit-events, version: 1}
    # The global pipeline deliberately remains in the anonymous context.
    inventory:
      provider: demo.continuous-repository-inventory
      version: 1
      with: {$ref: "$.event"}
    # This is intentionally separate from the global pipeline. Its explicit
    # correlation id creates a per-repository projection with no cross-context read.
    repositoryProjection:
      provider: demo.repository-projection
      version: 1
      with: {$ref: "$.event"}
    models:
      map:
        over: {$ref: "$.inventory.repositories"}
        context:
          model:
            provider: demo.repository-model
            version: 1
            with: {$ref: "$.item"}
            policy:
              maximum-attempts: 2
              retryable-error-classes: [transient]
              backoff-schedule-millis: [0]
        output: model
    topology:
      provider: demo.dependency-topology
      version: 1
      with: {$ref: "$.models"}
    architecture:
      provider: demo.system-model
      version: 1
      with: {$ref: "$.topology"}
    publication:
      provider: demo.architecture-publication
      version: 1
      with: {$ref: "$.architecture"}
      # Reconcile on the architecture summary rather than the logical invocation
      # id, so a re-cut of the same repository set converges on one publication.
      idempotency-key: {$ref: "$.architecture.summary"}
      policy:
        maximum-attempts: 2
        retryable-error-classes: [transient]
  outputs: [topology, architecture, publication]
