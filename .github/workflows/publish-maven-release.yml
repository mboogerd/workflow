name: Publish Maven Central release

on:
  push:
    tags:
      - "**"

permissions:
  contents: read

concurrency:
  group: maven-central-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out tagged revision
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check tag belongs to main
        id: main
        shell: bash
        run: |
          set -euo pipefail
          tag_commit="$(git rev-parse "${GITHUB_REF}^{commit}")"

          if git merge-base --is-ancestor "$tag_commit" refs/remotes/origin/main; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "Tag ${GITHUB_REF_NAME} does not point into main history; skipping publication."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Java 21
        if: steps.main.outputs.publish == 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Validate Maven Central configuration
        if: steps.main.outputs.publish == 'true'
        shell: bash
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          SIGNING_IN_MEMORY_KEY: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          SIGNING_IN_MEMORY_KEY_PASSWORD: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$MAVEN_CENTRAL_USERNAME" || { echo "MAVEN_CENTRAL_USERNAME is not configured" >&2; exit 1; }
          test -n "$MAVEN_CENTRAL_PASSWORD" || { echo "MAVEN_CENTRAL_PASSWORD is not configured" >&2; exit 1; }
          test -n "$SIGNING_IN_MEMORY_KEY" || { echo "SIGNING_IN_MEMORY_KEY is not configured" >&2; exit 1; }
          test -n "$SIGNING_IN_MEMORY_KEY_PASSWORD" || { echo "SIGNING_IN_MEMORY_KEY_PASSWORD is not configured" >&2; exit 1; }

      - name: Test
        if: steps.main.outputs.publish == 'true'
        run: ./gradlew test --rerun-tasks --no-daemon

      - name: Publish tagged version to Maven Central
        if: steps.main.outputs.publish == 'true'
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
        run: ./gradlew publishAndReleaseToMavenCentral --no-daemon -PreleaseVersion="$RELEASE_VERSION"
